[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fungalriskmeta"
version = "0.0.1"
description = "Component-resolved fungal metagenomic risk assessment toolkit."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "Hong Bai", email = "hongbai0101@gmail.com"},
]

[project.scripts]
fungalriskmeta = "fungalriskmeta.cli:main"

[tool.setuptools]
packages = ["fungalriskmeta"]
